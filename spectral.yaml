extends: spectral:oas
 
rules:
  info-contact: off
  operation-description: off
  oas3-api-servers: error       
  info-description: error       
  operation-operationId: error  
  operation-tags: error         

  ssc-paths-kebab-case: 
    severity: error
    message: "[{{property}}] Path segments must be lower-kebab-case." 
    given: $.paths.*~
    then: 
      function: pattern
      functionOptions: 
        match: "^(\/|[a-z0-9-]+|{[a-zA-Z0-9_|-]+})+$"
  
  ssc-no-version-in-paths: 
    severity: error
    message: "[{{property}}] Paths must not contain version numbers."
    given: $.paths.*~
    then: 
      function: pattern
      functionOptions: 
        match: "^((?!\/v[0-9]).)*$"
 
  ssc-camel-case-for-properties: 
    severity: error
    message: "[{{property}}] Request and response JSON must be camelCase."
    given: $..properties[*]~
    then: 
      function: pattern
      functionOptions:
        match: "^[a-z][a-z0-9]*([A-Z][a-z0-9]*)*$"
      
  ssc-isodate-format-properties: 
    severity: warn
    message: "Dates and times should be ISO 8601."
    given: "$..properties.[?(@property.match(/(^date([A-Z0-9]|$)|[^T]oDate([A-Z0-9]|$)|[^o]Date([A-Z0-9]|$))/))]"
    then:     
      function: schema
      functionOptions:
        schema:
          type: object 
          anyOf:
            - required:
                - type
                - format
            - required:
                - type
                - pattern
          properties:
            type:
              type: string
              enum:
                - string
            format:
              type: string
              enum:
                - date
                - date-time
            pattern:
              type: string
  ssc-isodate-format-parameters: 
    severity: warn
    message: "Dates and times should be ISO 8601."
    given: "$..parameters.[?(@property === 'name' && @.match(/(^date([A-Z0-9]|$)|[^T]oDate([A-Z0-9]|$)|[^o]Date([A-Z0-9]|$))/))]^"
    then: 
      field: schema
      function: schema
      functionOptions:
        schema:
          type: object 
          anyOf:
            - required:
                - type
                - format
            - required:
                - type
                - pattern
          properties:
            type:
              type: string
              enum:
                - string
            format:
              type: string
              enum:
                - date
                - date-time
            pattern:
              type: string
 
  ssc-custom-request-headers:
    severity: warn
    message: "[{{value}}] Custom request headers should not be defined."
    given: $..parameters[?(@.in==='header')].name
    then: 
      function: pattern
      functionOptions: 
        match: "/^(ACCEPT|ACCEPT-CHARSET|ACCEPT-DATETIME|ACCEPT-ENCODING|ACCEPT-LANGUAGE|ACCESS-CONTROL-REQUEST-METHOD|ACCESS-CONTROL-REQUEST-HEADERS|AUTHORIZATION|CACHE-CONTROL|CONNECTION|CONTENT-ENCODING|CONTENT-LENGTH|CONTENT-TYPE|COOKIE|DATE|EXPECT|FORWARDED|FROM|HOST|IF-MATCH|IF-MODIFIED-SINCE|IF-NONE-MATCH|IF-RANGE|IF-UNMODIFIED-SINCE|MAX-FORWARDS|ORIGIN|PRAGMA|PREFER|PROXY-AUTHORIZATION|RANGE|REFERER|TE|TRAILER|TRANSFER-ENCODING|USER-AGENT|UPGRADE|VIA|REQUEST-ID)$/i"
  ssc-custom-response-headers:
    severity: warn
    message: "[{{property}}] Custom response headers should not be defined."
    given: $..responses[*].headers.*~
    resolved: false
    then: 
      function: pattern
      functionOptions: 
        match: "/^(ACCESS-CONTROL-ALLOW-ORIGIN|ACCESS-CONTROL-ALLOW-CREDENTIALS|ACCESS-CONTROL-EXPOSE-HEADERS|ACCESS-CONTROL-MAX-AGE|ACCESS-CONTROL-ALLOW-METHODS|ACCESS-CONTROL-ALLOWHEADERS|ACCEPT-PATCH|ACCEPT-RANGES|AGE|ALLOW|ALT-SVC|CACHE-CONTROL|CONNECTION|CONTENT-DISPOSITION|CONTENT-ENCODING|CONTENT-LANGUAGE|CONTENT-LENGTH|CONTENT-LOCATION|CONTENT-RANGE|CONTENT-TYPE|DATE|DELTA-BASE|ETAG|EXPIRES|IM|LAST-MODIFIED|LINK|LOCATION|P3P|PRAGMA|PREFERENCE-APPLIED|PROXY-AUTHENTICATE|PUBLIC-KEY-PINS|RETRY-AFTER|SERVER|SET-COOKIE|STRICT-TRANSPORT-SECURITY|TRAILER|TRANSFER-ENCODING|TK|UPGRADE|VARY|VIA|WWW-AUTHENTICATE|REQUEST-ID)$/i"
 
  # 400 responses
  ssc-standard-error-response-400: 
    severity: error
    message: "Errors must return a SSC error."
    given: $..responses[?(@property == 400)]
    then: 
      field: content.application/problem+json
      function: truthy
  ssc-standard-responses-status-400:
    severity: warn
    message: "A 400 response status should be defined."
    given: $.paths[*][*].responses
    then:
      field: '400'
      function: truthy

  # 401 responses
  ssc-standard-error-response-401: 
    severity: error
    message: "Errors must return a SSC error."
    given: $..responses[?(@property == 401)]
    then: 
      field: content.application/problem+json
      function: truthy
  ssc-standard-responses-status-401:
    severity: warn
    message: "A 401 response status should be defined."
    given: $.paths[*][*].responses
    then:
      field: '401'
      function: truthy

  # 403 responses
  ssc-standard-error-response-403-json: 
    severity: error
    message: "Errors must return a SSC error."
    given: $..responses[?(@property == 403)]
    then: 
      field: content.application/problem+json
      function: truthy
  ssc-standard-responses-status-403:
    severity: warn
    message: "A 403 response status should be defined."
    given: $.paths[*][*].responses
    then:
      field: '403'
      function: truthy
  
  # 404 responses
  ssc-standard-error-response-404-json: 
    severity: error
    message: "Errors must return a SSC error."
    given: $..responses[?(@property == 404)]
    then: 
      field: content.application/problem+json
      function: truthy

  # 500 responses
  ssc-standard-error-response-500: 
    severity: error
    message: "Errors must return a SSC error."
    given: $..responses[?(@property == 500)]
    then: 
      field: content.application/problem+json
      function: truthy
  
  # Error Schema
  ssc-standard-error-response-schema: 
    severity: error
    message: "SSC errors implements RFC9457."
    given: $..responses[?(@property >= 400)].content.application/problem+json.schema.properties
    then: 
      - field: detail
        function: truthy
 
  ssc-request-id-response-header: 
    severity: error
    message: "Request-ID response header must be added."
    given: $..responses[*]
    then:
      field: headers
      function: schema
      functionOptions: 
        schema: 
          type: object
          anyOf:
            - required:
                - REQUEST-ID
            - required:
                - Request-ID
            - required:
                - Request-Id
            - required:
                - Request-id
            - required:
                - request-ID
            - required:
                - request-Id
            - required:
                - request-id

  ssc-request-id-response-header-required: 
    severity: warn
    message: "The Request-ID response header should be required."
    given: $..responses..[?(@property.match(/REQUEST-ID/i))]
    then:
      - field: required
        function: truthy
 
  ssc-open-api-version:
    message: "Specifications must use a supported version of OpenAPI."
    severity: error
    given: "$.openapi"
    then:
      function: pattern
      functionOptions: 
        match: "^(3.0.0|3.0.1|3.0.2|3.0.3|3.0.4)$"
 
  ssc-string-max-length: 
    severity: warn
    message: "Strings should be restricted to an appropriate maximum length."
    given: $..[?(@object() && @.type=="string" && !@.enum && !@.pattern && !@.format)]
    then: 
      field: maxLength
      function: truthy

  
  ssc-server-url:
    severity: error
    message: "APIs must have SSC server URLs."
    given: $.servers[*].url
    then: 
      - function: pattern
        functionOptions: 
          match: "^https"
      - function: pattern
        functionOptions: 
          match: "(https://rest-qd.hubwise.co.uk|https://rest-qi.hubwise.co.uk|https://rest.hubwise.co.uk)"
      - function: pattern
        functionOptions: 
          match: ".*\/[v][1-9][0-9]?$" # e.g. /v3
  ssc-server-description: 
    severity: warn
    message: "Server URLs should have a description."
    given: $.servers[*]
    then: 
      field: description
      function: truthy
  ssc-server-url-case:
    severity: warn
    message: "[{{value}}] URLs should be lower case."
    given: $.servers[*].url
    then:
      function: pattern
      functionOptions:
        notMatch: "[A-Z](?![^{]*\\})"
 
  ssc-security: 
    severity: error
    message: "Must define security."
    given: $
    then: 
      field: security
      function: truthy
  ssc-security-scheme: 
    severity: error
    message: "Must define a security schemes."
    given: $.components
    then: 
      field: securitySchemes
      function: truthy
  ssc-security-scheme-type: 
    severity: error
    message: "Only use HTTP bearer token."
    given: $.components.securitySchemes.*
    then: 
      function: schema
      functionOptions:
        schema:
          type: object
          anyOf:
            - required:
                - type
                - scheme
            - required:
                - type
                - name
                - in
          properties: 
            type:
              type: string
              enum: 
                - http
                - apiKey
            scheme:
              type: string
              enum: 
                - bearer
            name:
              type: string
            in:
              type: string
              enum: 
                - header
 
  ssc-semver: 
    severity: warn
    message: "[{{value}}] SSC API versions should follow SEMVER."
    given: $.info.version
    then: 
      function: pattern
      functionOptions: 
        match: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$" # RegEx with thanks to: https://regex101.com/r/vkijKf/1/ (as reccomended by https://semver.org/)
        
  ssc-operation-id-format:
    severity: warn
    message: "[{{value}}] The operationId should be camelCase and <= 100 chars in length."
    given: $.paths[*][*].operationId
    then: 
      - function: length
        functionOptions: 
          max: 100
      - function: casing
        functionOptions: 
          type: camel

  ssc-endpoint-description:
    severity: error
    message: "An endpoint must have a description."
    given: $.paths[*][get,put,post,delete,patch,head,options,trace]
    then:
      - field: description
        function: truthy  

  ssc-tags-root-level:
    severity: warn
    message: "Tags should be defined at root level."
    given: $
    then: 
      - field: tags
        function: truthy  
  ssc-tags-description:
    severity: warn
    message: "Tags should have a description."
    given: $.tags[*]
    then: 
      - field: description
        function: truthy 

  ssc-no-polymorphism-oneof:
    severity: error
    message: "oneOf must not be used."
    given: $..oneOf
    then:
      - function: falsy
  ssc-no-polymorphism-anyof:
    severity: info
    message: "Properties should not be polymorphic."
    given: $..anyOf
    then:
      - function: falsy

  ssc-input-parameter-example: 
    severity: error
    message: "Parameters must have examples."
    given: $.paths[*][*].parameters[*]
    then: 
      function: schema
      functionOptions:
        schema:
          anyOf:
            - required: [example]
            - required: [examples]
 
  ssc-request-body-example: 
    severity: error
    message: "A request body must have an example."
    given: $.paths[*][*].requestBody.content[*]
    then: 
      function: schema
      functionOptions:
        schema:
          anyOf:
            - required: [example]
            - required: [examples]
  ssc-request-body-example-summary: 
    severity: warn
    message: "An example should have a summary."
    given: $.paths[*][*].requestBody.content[*].examples[*]
    then: 
      field: summary
      function: truthy
  
  ssc-success-response-body-example: 
    severity: error
    message: "A 2xx response must have an example."
    given: $..responses[?(@property <= 205)].content[*]
    then: 
      function: schema
      functionOptions:
        schema:
          anyOf:
            - required: [example]
            - required: [examples]
  ssc-error-response-body-example: 
    severity: warn
    message: "A 4xx/5xx response should have an example."
    given: $..responses[?(@property >= 400)].content[*]
    then: 
      function: schema
      functionOptions:
        schema:
          anyOf:
            - required: [example]
            - required: [examples]
  ssc-success-response-body-example-summary:
    severity: warn
    message: "An example should have a summary."
    given: $.paths[*][*].responses[?(@property <= 205)].content[*].examples[*]
    then: 
      field: summary
      function: truthy